const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const u8u = s => u8(s.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - s.length % 4) % 4));
const cs = (window.crypto && window.crypto.subtle) || null;
const ASK = 'お送りした文の<br>住所（リンク）を押して<br>ひらいてください。';
async function openPage(raw) {
  const k = await cs.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
