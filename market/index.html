const $ = id => document.getElementById('lk-' + id);
const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const u8u = s => u8(s.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - s.length % 4) % 4));
const cs = (window.crypto && window.crypto.subtle) || null;
const ASK = 'お送りした文の<br>住所（リンク）を押して<br>ひらいてください。';
async function openPage(raw) {
  const k = await cs.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  return new TextDecoder().decode(await cs.decrypt({ name: 'AES-GCM', iv: u8(S.iv) }, k, u8(S.ct)));
}
async function show(html, raw) {
  if (document.readyState !== 'complete') await new Promise(r => window.addEventListener('load', r, { once: true }));
  try {
    localStorage.setItem(S.mem, btoa(String.fromCharCode.apply(null, raw)));
    const n = html.match(/const PLUGIN_NAME = ("(?:[^"\\]|\\.)*")/), m = html.match(/PIN_MARKS = (\[[^\]]*\])/);
    if (n && m) localStorage.setItem('fuyaseru-pro-gate:' + JSON.parse(n[1]), 'ok:' + JSON.parse(m[1]).map(h => h.slice(0, 8)).join(''));
  } catch (e) {}
  document.open(); document.write(html); document.close();
}
// 同じタブで # の後ろだけ変わった時（合い鍵なしで開いた後に合い鍵つきの住所を押した等）も開き直す。開いた後は document.open で消える
window.addEventListener('hashchange', () => start());
start();
async function start() {
  if (!cs) { $('lead').textContent = ''; $('msg').textContent = 'このブラウザではひらけません。ChromeかSafariでひらいてください。'; return; }
  $('msg').textContent = '';
  const h = (location.hash.match(/[#&]k=([A-Za-z0-9_-]{43})/) || [])[1];
  if (location.hash) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  if (h) {
    try { const r = u8u(h); await show(await openPage(r), r); return; }
    catch (e) { $('lead').innerHTML = ASK; $('msg').textContent = 'この住所ではひらけませんでした。届いた文の住所を、もう一度そのまま押してください。'; return; }
  }
  try { const r = localStorage.getItem(S.mem); if (r) { await show(await openPage(u8(r)), u8(r)); return; } } catch (e) { try { localStorage.removeItem(S.mem); } catch (_) {} }
  $('lead').innerHTML = ASK;
}
